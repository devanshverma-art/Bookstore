
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Book Store Header</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #2c4053;
            color: white;
        }

        .header {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo {
            position: absolute;
            top: 10px;
            left: 20px;
            width: 130px;
            height: 100px;
            object-fit: contain;
        }

        h1 {
            margin: 0 0 14px;
            font-size: 30px;
            text-align: center;
        }

        .nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav a {
            display: inline-block;
            padding: 11px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }

        .nav a:hover {
            background-color: #217dbb;
        }

        @media (max-width: 600px) {
            .logo {
                width: 80px;
                height: 65px;
                left: 8px;
                top: 8px;
            }

            h1 {
                font-size: 21px;
                margin-top: 35px;
            }

            .nav {
                gap: 5px;
            }

            .nav a {
                padding: 8px 10px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="header">

        <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQwP_0Rg4vRcSH1z_2LO9GoJwAQEfw-Z8jHqCePbwXjCg&s=10"
            alt="G.L. Bajaj Logo"
            class="logo"
        >

        <h1>G.L. Bajaj Online Book Store</h1>

        <nav class="nav">
            <a href="home.html" target="rightFrame">Home</a>
            <a href="login.html" target="rightFrame">Login</a>
            <a href="register.html" target="rightFrame">Register</a>
            <a href="catalogue.html" target="rightFrame">Catalogue</a>
            <a href="cart.html" target="rightFrame">Cart</a>
        </nav>

    </div>
</body>
</html>
