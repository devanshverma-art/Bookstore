<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .cart-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .cart-table th,
        .cart-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            vertical-align: middle;
        }

        .cart-table th {
            background-color: #3498db;
            color: white;
        }

        .cart-book-img {
            width: 65px;
            height: 85px;
            object-fit: contain;
            display: block;
        }

        .cart-table button {
            cursor: pointer;
        }

        .checkout-btn {
            margin-top: 15px;
            padding: 9px 14px;
        }
    </style>
</head>

<body>
    <div class="catalogue-container">
        <h2>Your Shopping Cart</h2>

        <table class="cart-table">
            <thead>
                <tr>
                    <th>Book Image</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Price</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>
                        <img
                            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQs7EFXEOXElZSl8JgRP-fipTfb6EsZ7wbSy2dhZVDWAg&s=10"
                            alt="Computer Science"
                            class="cart-book-img">
                    </td>
                    <td>Computer Science</td>
                    <td>Robert Sedgewick</td>
                    <td>Rs. 4000</td>
                    <td>
                        <button type="button">-</button>
                        2
                        <button type="button">+</button>
                    </td>
                    <td>
                        <button type="button">Remove</button>
                    </td>
                </tr>

                <tr>
                    <td>
                        <img
                            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7rYQ_y-tRLm3edki7P7CoflK9jrue2CTzn7HOkhPztA&s=10"
                            alt="Artificial Intelligence"
                            class="cart-book-img">
                    </td>
                    <td>Artificial Intelligence</td>
                    <td>Charu C. Agarwal</td>
                    <td>Rs. 5000</td>
                    <td>
                        <button type="button">-</button>
                        1
                        <button type="button">+</button>
                    </td>
                    <td>
                        <button type="button">Remove</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <p>Total Price: Rs. 13,000</p>

        <button type="button" class="checkout-btn">
            Proceed to Checkout
        </button>
    </div>
</body>
</html>
